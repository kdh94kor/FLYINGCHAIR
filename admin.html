<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플라잉 체어 - 분석 대시보드</title>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #f0f2f5;
            --bg-panel: #ffffff;
            --text-main: #1c1e21;
            --text-muted: #65676b;
            --primary: #4e73df;
            --primary-hover: #2e59d9;
            --success: #1cc88a;
            --info: #36b9cc;
            --border: #e3e6f0;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Malgun Gothic', 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: var(--text-main);
            text-align: left;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }
        /* Date Filters */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
            background: var(--bg-panel);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .filter-bar input[type="date"] {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            background: var(--primary);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:hover { background: var(--primary-hover); }
        .btn-outline {
            background: white;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }
        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 4px solid var(--primary);
        }
        .card.success { border-left-color: var(--success); }
        .card.info { border-left-color: var(--info); }
        
        .card-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 5px;
        }
        .card-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--text-main);
        }
        /* Charts */
        .chart-container {
            background: var(--bg-panel);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .chart-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📈 플라잉 체어 트래픽 분석</h1>
        
        <!-- Filter Bar -->
        <div class="filter-bar">
            <span>기간 조회:</span>
            <input type="date" id="date-from">
            <span>~</span>
            <input type="date" id="date-to">
            <button class="btn" onclick="fetchData()">조회</button>
            <div style="margin-left:auto; display:flex; gap:5px;">
                <button class="btn btn-outline" onclick="setPreset('today')">오늘</button>
                <button class="btn btn-outline" onclick="setPreset('week')">최근 7일</button>
                <button class="btn btn-outline" onclick="setPreset('month')">이번 달</button>
                <button class="btn btn-outline" onclick="setPreset('all')">전체</button>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="grid">
            <div class="card">
                <div class="card-title">방문자 수 (명)</div>
                <div class="card-value" id="stat-visitors">0</div>
            </div>
            <div class="card success">
                <div class="card-title">실행된 게임 (회)</div>
                <div class="card-value" id="stat-games">0</div>
            </div>
            <div class="card info">
                <div class="card-title">평균 플레이어 (명/게임)</div>
                <div class="card-value" id="stat-avg">0</div>
            </div>
        </div>

        <!-- Trend Chart -->
        <div class="chart-container">
            <h3>방문 및 게임 트렌드 (일별)</h3>
            <canvas id="trendChart" height="80"></canvas>
        </div>

        <!-- Detailed Analytics -->
        <div class="chart-grid">
            <div class="chart-container">
                <h3>주요 요일 분석</h3>
                <canvas id="dayChart" height="150"></canvas>
            </div>
            <div class="chart-container">
                <h3>시간대별 트래픽 분석 (서버 코스트 최적화용)</h3>
                <canvas id="hourChart" height="150"></canvas>
            </div>
        </div>
    </div>

    <script>
        let trendChartObj, dayChartObj, hourChartObj;

        // Date Presets
        function setPreset(type) {
            const today = new Date();
            let fromDate = new Date();
            
            if (type === 'today') {
                fromDate = today;
            } else if (type === 'week') {
                fromDate.setDate(today.getDate() - 7);
            } else if (type === 'month') {
                fromDate.setDate(1); // 1st of current month
            } else if (type === 'all') {
                document.getElementById('date-from').value = '';
                document.getElementById('date-to').value = '';
                fetchData();
                return;
            }
            
            document.getElementById('date-from').value = fromDate.toISOString().split('T')[0];
            document.getElementById('date-to').value = today.toISOString().split('T')[0];
            fetchData();
        }

        async function fetchData() {
            const from = document.getElementById('date-from').value;
            let to = document.getElementById('date-to').value;
            
            // to 날짜의 끝(23:59:59)까지 포함하기 위해 다음날로 변환하거나 API에 전송
            let url = '/api/admin/stats?';
            if (from) url += `from=${from}T00:00:00Z&`;
            if (to) url += `to=${to}T23:59:59Z`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                
                if (data.error) return alert(data.error);
                renderDashboard(data);
            } catch (err) {
                console.error(err);
                alert('통계 데이터를 불러오지 못했습니다.');
            }
        }

        function renderDashboard(data) {
            // Update Cards
            document.getElementById('stat-visitors').innerText = data.totalVisitors.toLocaleString();
            document.getElementById('stat-games').innerText = data.totalGames.toLocaleString();
            const avg = data.totalGames > 0 ? (data.totalPlayers / data.totalGames).toFixed(1) : 0;
            document.getElementById('stat-avg').innerText = avg;

            // Trend Chart
            const trendCtx = document.getElementById('trendChart');
            if(trendChartObj) trendChartObj.destroy();
            trendChartObj = new Chart(trendCtx, {
                type: 'line',
                data: {
                    labels: data.trendData.map(d => d.date),
                    datasets: [
                        { label: '방문자', data: data.trendData.map(d => d.visits), borderColor: '#4e73df', tension: 0.1 },
                        { label: '게임 횟수', data: data.trendData.map(d => d.games), borderColor: '#1cc88a', tension: 0.1 }
                    ]
                }
            });

            // Day Chart
            const days = ['일', '월', '화', '수', '목', '금', '토'];
            const dayCtx = document.getElementById('dayChart');
            if(dayChartObj) dayChartObj.destroy();
            dayChartObj = new Chart(dayCtx, {
                type: 'bar',
                data: {
                    labels: days,
                    datasets: [{
                        label: '방문 횟수',
                        data: days.map((_, i) => data.dayOfWeekCount[i]),
                        backgroundColor: '#36b9cc'
                    }]
                }
            });

            // Hour Chart
            const hours = Array.from({length: 24}, (_, i) => `${i}시`);
            const hourCtx = document.getElementById('hourChart');
            if(hourChartObj) hourChartObj.destroy();
            hourChartObj = new Chart(hourCtx, {
                type: 'bar',
                data: {
                    labels: hours,
                    datasets: [{
                        label: '시간대별 트래픽',
                        data: data.hourOfDayCount,
                        backgroundColor: '#f6c23e'
                    }]
                }
            });
        }

        // Initialize
        setPreset('week'); // Default to last 7 days
    </script>
</body>
</html>
